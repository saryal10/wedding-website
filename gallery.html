<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Sarad & Namuna Wedding</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rosewood: '#2c1820',
            blush: '#fcf8f6',
            champagne: '#f4ece1',
            accent: '#c5a059',
            accentHover: '#ab8843',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-blush text-rosewood font-sans antialiased selection:bg-accent selection:text-white">

  <nav class="fixed top-0 left-0 w-full z-50 transition-all duration-300 py-4 px-6 glass shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-serif text-2xl tracking-wider text-rosewood flex items-center gap-2">
        <span>S</span> <span class="text-accent">&</span> <span>N</span>
      </a>
      <div class="hidden md:flex space-x-8 text-sm font-medium tracking-wide uppercase text-gray-700">
        <a href="index.html#story" class="hover:text-accent transition duration-300">Our Story</a>
        <a href="index.html#schedule" class="hover:text-accent transition duration-300">Schedule</a>
        <a href="gallery.html" class="text-accent font-semibold transition duration-300">Gallery</a>
        <a href="index.html#rsvp" class="hover:text-accent transition duration-300">RSVP</a>
      </div>
      <button onclick="openUploadModal()" class="bg-accent text-white px-5 py-2 rounded-full text-xs uppercase tracking-widest font-semibold hover:bg-accentHover transition-all shadow-md hover:scale-105">Upload Media</button>
    </div>
  </nav>

  <header class="pt-36 pb-10 px-6 text-center max-w-4xl mx-auto">
    <span class="text-xs uppercase tracking-[0.4em] text-accent font-semibold">Memories & Moments</span>
    <h1 class="font-serif text-5xl md:text-6xl mt-2 text-rosewood">Wedding Gallery</h1>
    <p class="text-gray-600 font-light mt-4 text-sm tracking-wide">Explore photos and videos from across our celebration events.</p>
    <div class="w-16 h-0.5 bg-accent mx-auto mt-6"></div>
  </header>

  <!-- Gallery Tabs -->
  <div class="flex flex-wrap justify-center gap-2 md:gap-4 px-4 mb-12">
    <button onclick="switchTab('Memories')" data-tab="Memories" class="tab-btn px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold transition bg-accent text-white shadow-md">Memories</button>
    <button onclick="switchTab('Thursday 22nd')" data-tab="Thursday 22nd" class="tab-btn px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold transition bg-white/70 text-rosewood hover:bg-champagne shadow-sm">Thursday 22nd</button>
    <button onclick="switchTab('Friday 23rd Oct')" data-tab="Friday 23rd Oct" class="tab-btn px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold transition bg-white/70 text-rosewood hover:bg-champagne shadow-sm">Friday 23rd Oct</button>
    <button onclick="switchTab('Saturday 24th October')" data-tab="Saturday 24th October" class="tab-btn px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold transition bg-white/70 text-rosewood hover:bg-champagne shadow-sm">Saturday 24th October</button>
  </div>

  <main class="pb-28 px-6 max-w-6xl mx-auto">
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Dynamically Populated -->
    </div>
  </main>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass bg-white/95 p-8 rounded-3xl max-w-md w-full shadow-2xl relative border border-accent/30">
      <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-gray-500 hover:text-rosewood text-xl">&times;</button>
      <h3 class="font-serif text-2xl text-rosewood mb-2">Upload Photos / Videos</h3>
      <p class="text-xs text-gray-500 mb-6">Select multiple files to upload them simultaneously to the live gallery.</p>
      
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-600 mb-1 font-medium">Select Category *</label>
          <select id="uploadCategory" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm bg-white focus:ring-2 focus:ring-accent/50">
            <option value="Memories">Memories</option>
            <option value="Thursday 22nd">Thursday 22nd</option>
            <option value="Friday 23rd Oct">Friday 23rd Oct</option>
            <option value="Saturday 24th October">Saturday 24th October</option>
          </select>
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-600 mb-1 font-medium">Choose Files (Multiple Allowed) *</label>
          <input type="file" id="mediaFiles" name="mediaFiles" accept="image/*,video/*" multiple required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-champagne file:text-rosewood hover:file:bg-accent hover:file:text-white file:transition">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-600 mb-1 font-medium">Caption / Note (Applied to batch)</label>
          <input type="text" id="uploadCaption" placeholder="e.g., Fun moments at the venue!" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm bg-white focus:ring-2 focus:ring-accent/50">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-600 mb-1 font-medium">Upload Password (Required) *</label>
          <input type="password" id="uploadPassword" placeholder="Enter security password" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm bg-white focus:ring-2 focus:ring-accent/50">
        </div>

        <button type="submit" id="uploadBtn" class="w-full py-3 bg-accent text-white rounded-xl text-xs uppercase tracking-widest font-semibold hover:bg-accentHover transition shadow-md">
          Upload Batch Now
        </button>
      </form>
      <div id="uploadStatus" class="hidden mt-4 text-center text-xs font-medium py-2 px-3 rounded-lg"></div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center p-4">
    <button id="closeLightbox" class="absolute top-6 right-6 text-white text-3xl font-light hover:text-accent transition">&times;</button>
    <div class="max-w-4xl max-h-[80vh] flex flex-col items-center">
      <div id="lightboxContentContainer" class="max-w-full max-h-[70vh] flex items-center justify-center"></div>
      <p id="lightboxCaption" class="text-champagne font-serif text-lg italic mt-4 text-center"></p>
      <a id="lightboxDownload" href="" download class="mt-4 inline-flex items-center gap-2 bg-accent text-white px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold hover:bg-accentHover transition shadow-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Download File
      </a>
    </div>
  </div>

  <footer class="py-10 text-center text-xs text-gray-500 border-t border-gray-200 bg-champagne/20">
    <p class="font-serif tracking-widest uppercase mb-1">Sarad & Namuna</p>
    <p>© 2026. Created with love.</p>
  </footer>

  <script>
    let galleryData = {};
    let currentTab = 'Memories';

    async function fetchGalleryData() {
      try {
        const response = await fetch('/api/gallery');
        galleryData = await response.json();
        renderGallery(currentTab);
      } catch (err) {
        console.error('Error loading gallery data:', err);
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('data-tab') === tabName) {
          btn.className = "tab-btn px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold transition bg-accent text-white shadow-md";
        } else {
          btn.className = "tab-btn px-6 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold transition bg-white/70 text-rosewood hover:bg-champagne shadow-sm";
        }
      });
      renderGallery(tabName);
    }

    function renderGallery(tabName) {
      const gridContainer = document.getElementById('gallery-grid');
      gridContainer.innerHTML = '';

      const items = galleryData[tabName] || [];

      if (items.length === 0) {
        gridContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12 text-sm italic">No photos or videos uploaded in this category yet. Be the first to upload!</p>`;
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement('div');
        const staggeredClass = (index % 3 === 1) ? 'sm:mt-8' : '';
        card.className = `group relative overflow-hidden rounded-3xl shadow-lg aspect-[4/5] bg-champagne cursor-pointer ${staggeredClass}`;

        let mediaElement = '';
        if (item.type === 'video') {
          mediaElement = `<video src="${item.src}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" muted></video>`;
        } else {
          mediaElement = `<img src="${item.src}" alt="${item.caption}" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">`;
        }

        card.innerHTML = `
          ${mediaElement}
          <div class="absolute inset-0 bg-gradient-to-t from-rosewood/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex justify-between items-end p-6">
            <span class="text-white font-serif text-lg italic">${item.caption}</span>
            <a href="${item.src}" download class="bg-accent/90 hover:bg-accent text-white p-2.5 rounded-full shadow-md transition transform hover:scale-110 flex items-center justify-center" title="Download" onclick="event.stopPropagation()">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </a>
          </div>
        `;

        card.addEventListener('click', () => {
          openLightbox(item);
        });

        gridContainer.appendChild(card);
      });
    }

    function openUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
      document.getElementById('uploadModal').classList.add('flex');
    }
    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
      document.getElementById('uploadModal').classList.remove('flex');
      document.getElementById('uploadForm').reset();
      document.getElementById('uploadStatus').classList.add('hidden');
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxContentContainer = document.getElementById('lightboxContentContainer');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxDownload = document.getElementById('lightboxDownload');
    const closeLightbox = document.getElementById('closeLightbox');

    function openLightbox(item) {
      lightboxContentContainer.innerHTML = '';
      if (item.type === 'video') {
        lightboxContentContainer.innerHTML = `<video src="${item.src}" controls autoplay class="max-w-full max-h-[70vh] object-contain rounded-xl shadow-2xl"></video>`;
      } else {
        lightboxContentContainer.innerHTML = `<img src="${item.src}" alt="${item.caption}" class="max-w-full max-h-[70vh] object-contain rounded-xl shadow-2xl">`;
      }
      lightboxCaption.innerText = item.caption;
      lightboxDownload.href = item.src;
      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
    }

    closeLightbox.addEventListener('click', () => {
      lightbox.classList.add('hidden');
      lightbox.classList.remove('flex');
    });
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.add('hidden');
        lightbox.classList.remove('flex');
      }
    });

    const uploadForm = document.getElementById('uploadForm');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      uploadBtn.disabled = true;
      uploadBtn.innerText = "Uploading batch...";
      uploadStatus.classList.add('hidden');

      const formData = new FormData();
      formData.append('category', document.getElementById('uploadCategory').value);
      formData.append('caption', document.getElementById('uploadCaption').value);
      formData.append('password', document.getElementById('uploadPassword').value);

      const fileInput = document.getElementById('mediaFiles');
      for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('mediaFiles', fileInput.files[i]);
      }

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        if (result.success) {
          uploadStatus.innerText = result.message;
          uploadStatus.className = "mt-4 text-center text-xs font-medium py-2 px-3 rounded-lg bg-emerald-50 text-emerald-700 block";
          uploadForm.reset();
          fetchGalleryData(); 
          setTimeout(() => {
            closeUploadModal();
            uploadBtn.disabled = false;
            uploadBtn.innerText = "Upload Batch Now";
          }, 1500);
        } else {
          throw new Error(result.error || 'Upload failed.');
        }
      } catch (err) {
        uploadStatus.innerText = err.message;
        uploadStatus.className = "mt-4 text-center text-xs font-medium py-2 px-3 rounded-lg bg-rose-50 text-rose-700 block";
        uploadBtn.disabled = false;
        uploadBtn.innerText = "Upload Batch Now";
      }
    });

    fetchGalleryData();
  </script>
</body>
</html>
