<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Sarad & Namuna Wedding</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rosewood: '#2c1820',
            blush: '#fcf8f6',
            champagne: '#f4ece1',
            accent: '#c5a059',
            accentHover: '#ab8843',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-blush text-rosewood font-sans antialiased selection:bg-accent selection:text-white">

  <nav class="fixed top-0 left-0 w-full z-50 transition-all duration-300 py-4 px-6 glass shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-serif text-2xl tracking-wider text-rosewood flex items-center gap-2">
        <span>S</span> <span class="text-accent">&</span> <span>N</span>
      </a>
      <div class="hidden md:flex space-x-8 text-sm font-medium tracking-wide uppercase text-gray-700">
        <a href="index.html#story" class="hover:text-accent transition duration-300">Our Story</a>
        <a href="index.html#schedule" class="hover:text-accent transition duration-300">Schedule</a>
        <a href="gallery.html" class="text-accent font-semibold transition duration-300">Gallery</a>
        <a href="index.html#rsvp" class="hover:text-accent transition duration-300">RSVP</a>
      </div>
      <a href="index.html#rsvp" class="bg-accent text-white px-5 py-2 rounded-full text-xs uppercase tracking-widest font-semibold hover:bg-accentHover transition-all shadow-md hover:scale-105">RSVP Now</a>
    </div>
  </nav>

  <header class="pt-36 pb-16 px-6 text-center max-w-4xl mx-auto">
    <span class="text-xs uppercase tracking-[0.4em] text-accent font-semibold">Memories & Moments</span>
    <h1 class="font-serif text-5xl md:text-6xl mt-2 text-rosewood">Wedding Gallery</h1>
    <p class="text-gray-600 font-light mt-4 text-sm tracking-wide">A curated look back at our unforgettable celebration.</p>
    <div class="w-16 h-0.5 bg-accent mx-auto mt-6"></div>
  </header>

  <main class="pb-28 px-6 max-w-6xl mx-auto">
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      </div>
  </main>

  <footer class="py-10 text-center text-xs text-gray-500 border-t border-gray-200 bg-champagne/20">
    <p class="font-serif tracking-widest uppercase mb-1">Sarad & Namuna</p>
    <p>© 2026. Created with love.</p>
  </footer>

  <script>
    // --- ADD OR REMOVE IMAGE PATHS HERE (Supports 100+ images easily) ---
    const galleryImages = [
      { src: 'img/photo1.jpg', caption: 'Special Moments' },
      { src: 'img/photo2.jpg', caption: 'The Ceremony' },
      { src: 'img/photo3.jpg', caption: 'Joyful Smiles' },
      { src: 'img/photo4.jpg', caption: 'Celebration Time' },
      { src: 'img/photo5.jpg', caption: 'Family & Friends' },
      { src: 'img/photo6.jpg', caption: 'Precious Details' },
      { src: 'img/photo7.jpg', caption: 'The Reception' },
      { src: 'img/photo8.jpg', caption: 'Evening Glow' },
      { src: 'img/photo9.jpg', caption: 'Forever Together' },
      // To add more photos later, just paste them below in this format:
      // { src: 'img/photo10.jpg', caption: 'Beautiful Memory' },
    ];

    const gridContainer = document.getElementById('gallery-grid');

    // Automatically build elements for each image in the array
    galleryImages.forEach((item, index) => {
      const card = document.createElement('div');
      // Add subtle alternating top margins on desktop grid items for an organic masonry feel
      const staggeredClass = (index % 3 === 1) ? 'sm:mt-8' : '';
      
      card.className = `group relative overflow-hidden rounded-3xl shadow-lg aspect-[4/5] bg-champagne ${staggeredClass}`;
      
      card.innerHTML = `
        <img src="${item.src}" alt="${item.caption}" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
        <div class="absolute inset-0 bg-gradient-to-t from-rosewood/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-6">
          <span class="text-white font-serif text-lg italic">${item.caption}</span>
        </div>
      `;
      
      gridContainer.appendChild(card);
    });
  </script>

</body>
</html>
